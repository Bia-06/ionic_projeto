<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Cadastro de Usuário</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card class="form-card">
    <ion-card-header>
      <ion-card-title>Criar nova conta</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item lines="full" class="custom-item">
        <ion-input label="Nome" labelPlaceholder="stacked" type="text"></ion-input>
      </ion-item>

      <ion-item lines="full" class="custom-item">
        <ion-input label="E-mail" labelPlaceholder="stacked" type="email"></ion-input>
      </ion-item>

      <ion-item lines="full" class="custom-item">
        <ion-input label="Senha" labelPlaceholder="stacked" type="password"></ion-input>
      </ion-item>

      <div *ngIf="mensagemErro" class="ion-padding-vertical">
        <ion-text color="danger">
          {{ mensagemErro }}
        </ion-text>

        <div *ngIf="mensagemSucesso" class="ion-padding-vertical">
          <ion-text color="success">
            {{ mensagemSucesso }}
          </ion-text>
        </div>
      </div>
      <ion-button expand="block" color="primary" class="ion-margin-top" (click)="cadastrar()">
          <ion-spinner *ngIf="carregando" name="crescent"></ion-spinner>
          <span *ngIf="!carregando">Finalizar Cadastrar</span>
        </ion-button>

    </ion-card-content>
  </ion-card>
</ion-content>
